<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign up</title>
  </head>
  <body>
    <!-- The same form as the SignUp widget in dart/test/fixture_test.dart. -->
    <h1>Sign up</h1>
    <p>Pick what you want.</p>
    <input type="checkbox" aria-label="News" />
    <button role="switch" aria-checked="true">Weekly digest</button>
    <input aria-label="Name" />
    <button>Save</button>
    <button disabled>Off</button>
    <div role="radiogroup" aria-label="Colour">
      <input type="radio" name="colour" aria-label="Teal" checked />
      <input type="radio" name="colour" aria-label="Plum" disabled />
      <input type="radio" name="colour" aria-label="Saffron" />
    </div>
  </body>
</html>
